# Default extraction schema, used when no schema_config_path is given.
# A custom schema replaces this file entirely; `abbreviations` is always kept.
#
# Per-field keys:
#   name                 dict key in the extracted record (snake_case)
#   type                 str | int | float | bool | None | list[...] | dict[str, ...] | object, unions with "|"
#   description          guidance shown to the LLM; {main_extraction_keyword} is substituted
#   required             rendered as required/optional in the prompt
#   default              value used when the field is absent (derived from the type if omitted)
#   allowed_values       inline list the formatter maps values onto
#   allowed_values_ref   name of a runtime-supplied allowed-values list
#   value_fields         sub-fields, for type "object" or "dict[str, object]"
#   extraction_only      kept by the extraction crew only; the format crew consumes and drops it
#   format_note          field-specific rule for the format crew
#   example              example value for the prompt's example JSON
#   variable_example     example value for the variable-composition example (falls back to example)
#   weight               evaluation weight relative to sibling fields (unspecified weights share the remainder)
#   match_mode           evaluation rule: exact | semantic | item_list | joined_text | keyed_values | numeric (derived from type if omitted)
#   similarity_threshold matching threshold (defaults per match_mode: semantic/item_list/keyed_values 0.9, joined_text 0.8)
#   similarity_threshold_mode  relative | absolute tolerance for numeric fields
#   plot_kind            categorical_distribution | numeric_distribution | none
#   evaluation_note      field-specific judging rule for the agentic evaluator

version: "1.0"

primary_composition_field: compositions_property_values

composition_fields:
  - name: compositions_property_values
    type: "dict[str, int|float|None]"
    description: >-
      Mapping of every material composition reported in the article's own work to its {main_extraction_keyword} value. Keys are full chemical formulas with proper fractions; values are the numeric {main_extraction_keyword} values.
    required: true
    weight: 0.6
    plot_kind: numeric_distribution
    format_note: >-
      Remove compositions whose {main_extraction_keyword} value is null, but never remove a composition that has a value.
    example:
      Ba0.99Ca0.01Ti0.68Zr0.32O3: 375
      Ba0.98Ca0.02Ti0.78Zr0.22O3: 350
      Ba0.97Ca0.03Ti0.88Zr0.12O3: 325
      Ba0.96Ca0.04Ti0.98Zr0.02O3: 300
    variable_example:
      "0.5NaNbO3": 375
      "(1-x)Na0.2K2(x)Bi0.5TiO3 - (y)NaNbO3 where x=0, y=0.5": 350
      "(1-x)Na0.2K2(x)Bi0.5TiO3 - (y)NaNbO3 where x=0.1, y=0.4": 325
      "(1-x)Na0.2K2(x)Bi0.5TiO3 - (y)NaNbO3 where x=0.2, y=0.3": 375
      "(1-x)Na0.2K2(x)Bi0.5TiO3 - (y)NaNbO3 where x=0.3, y=0.1": 425
    evaluation_note: |-
      For each entry, decide:
         a. Keys: Determine if each ground truth key is matched in test data (1) or missing (0)
            Note:
            - The order of keys doesn't matter, only whether each ground truth key
            has a match. Consider reasonable variations (e.g., spacing in chemical formulas, writing the way of environment or temperature/pressure etc.)
            - However, BE STRICT about composition matching. Don't consider if the composition fraction position is different (for e.g., in ground truth data, fraction is written after the element, but in test data it is written before or the composition fraction values are not mathcing exactly).
            - The fraction balues MUST match. Sometimes the multiplications are already done, for e.g., ground truth data has 2(0.3) and test data has (0.6) - they are the same.
            - Most of the time bracket and without brackets are the same, for e.g. - Ba(0.5)Ni(0.5)TiO3 and Ba0.5Ni0.5TiO3 are the same.
            - Sometimes the extracted data will have already calculated compositions if there are any options to compute, they should be considered true, for e.g., Ba2(0.25)Ni0.5TiO3 and Ba0.5Ni0.5TiO3 are the same or Ba(1/3)Ni(2/3)TiO3 or Ba0.33Ni0.67TiO3 are the same.
            **Important for composition with 'null' property values**
            - Composition with 'null' property value in ground truth data should not be counted as missing if the test data doesn't have that composition.
            - Composition with 'null' property value from ground truth data should not be counted for total_ground_truth_keys unless the same key is present in the test data set.
            - If ground truth has composition chemical formula, but test data has chemical name or spelled formula or abbreviation it should consider as 'false'. Even if the correct abbreviation or chemical name is present instead of the composition chemical formula it should be considered as 'false'.
            - Also, for chemical structures for which chemical formula is not possible (for e.g. graphene), the test data can have both short abbreviation or the chemical name. But, for chemical structures for which chemical formula is possible (for e.g. BN (boron nitride)) the chemical name (for this case, BN) should be there in the test data for 'true', otherwise 'false'.
         b. Values: Do the property values match (1) or not (0) corresponding to the keys?
            Note: The ground truth values can be given in a range (inside []) or as a single value.
            - If the test value is inside the range, it is considered a match.
            - Many times keys can't match exactly but the value will match - so while matching value be less strict about the finding the associated key.
            {value_error_threshold_instructions}

  - name: abbreviations
    type: "dict[str, str]"
    description: >-
      Only if a composition is referred to by an abbreviation: map each abbreviation to its full composition. Abbreviations written in all CAPITAL letters MUST be included. Don't treat Greek letters as abbreviations (α is not 'alpha'), don't treat English chemical names as abbreviations (ZnO is not 'zinc oxide'), and don't include abbreviations that only refer to other papers' materials.
    required: false
    extraction_only: true
    example:
      g-CN: g-C3N4

  - name: property_unit
    type: str
    description: The unit in which the {main_extraction_keyword} values are reported.
    required: true
    weight: 0.2
    match_mode: exact
    example: pC/N
    evaluation_note: |-
      Decide if the units match exactly (1) or not (0)

  - name: family
    type: str
    description: The material family (base or host material system) that the compositions belong to.
    required: true
    weight: 0.2
    match_mode: exact
    plot_kind: categorical_distribution
    example: BaTiO3
    variable_example: NaNbO3
    evaluation_note: |-
      Decide if the material family descriptions match (1) or not (0) - can have some variation, but overall should be similar.

synthesis_fields:
  - name: method
    type: str
    description: The experimental synthesis method used to prepare the materials, e.g. solid-state reaction or sol-gel.
    required: true
    weight: 0.2
    allowed_values_ref: allowed_synthesis_methods
    format_note: If allowed values are listed, change the method to the matching allowed value; otherwise keep it as it is.
    example: solid-state reaction
    evaluation_note: |-
      Decide if the synthesis methods match (1) or not (0)

  - name: precursors
    type: "list[str]"
    description: >-
      Starting chemicals used in the synthesis, given by chemical name only (no company names or purity). Return an empty list if the precursors are not clearly mentioned.
    required: true
    weight: 0.3
    plot_kind: categorical_distribution
    format_note: >-
      If a precursor is given by an industry name or chemical name instead of a chemical composition, rewrite it as the chemical composition. Keep it a list of strings.
    example: ["BaCO3", "CaCO3", "TiO2", "ZrO2"]
    evaluation_note: |-
      For each precursor, decide if it's correctly identified (1) or not (0)
         Note: The order of precursors doesn't matter, only whether each ground truth precursor is correctly identified in the test data. Keys can be either in chemical formula or chemical name - you need to understand the meaning of the keys.

  - name: steps
    type: "list[str]"
    description: The experimental synthesis procedure, as an ordered list of steps.
    required: true
    weight: 0.2
    match_mode: joined_text
    format_note: Keep the steps unmodified.
    example: ["Raw powders were weighed in stoichiometric ratio and ball-milled for 24 h", "The mixture was calcined at 1200 °C for 2 h", "Pellets were sintered at 1450 °C for 4 h"]
    evaluation_note: |-
      Decide if the synthesis procedure steps match or not. The match value should be a float between 0.00 and 1.00 and it should be round up to two decimal points.
         Note: This is a holistic judgment about whether the test steps capture the same procedure as the ground truth steps.

  - name: characterization_techniques
    type: "list[str]"
    description: >-
      Characterization techniques used on the materials, given only as the instrument name or its short name, e.g. XRD, Raman Spectroscopy, SEM, TEM.
    required: true
    weight: 0.3
    plot_kind: categorical_distribution
    allowed_values_ref: allowed_characterization_techniques
    format_note: If allowed values are listed, change each technique to the matching allowed value; otherwise keep them as they are.
    example: ["XRD", "SEM", "Raman Spectroscopy"]
    evaluation_note: |-
      For each technique, decide if it's correctly identified (1) or not (0)
         Note: The order of techniques doesn't matter, only whether each ground truth technique is correctly identified in the test data. Keys can be either in instrument name or short name of the characterization process - you need to understand the meaning of the keys.

extra_domains: {}
